# Buildings of Tula State University (TulSU) and how rooms are linked to a map.
#
# A room such as "9-324" or "Гл.-402" is "<building prefix>-<room>": the part before the first
# "-" identifies the building. Rooms whose prefix is listed below get a link to a map search
# for the building's address; every other room (or a building without an address) is shown as
# plain text - no guessed or broken links.
#
# The university publishes no floor plans or room schemes, so the link leads to the building
# on the map, not to the room itself.
#
# To add a building append a [[building]] table:
#   prefixes - how the building is written in room names (case-insensitive, exact match)
#   name     - human-readable name (documentation only)
#   address  - search query for the map; this is what the link opens
#   page     - official tulsu.ru page of the building (documentation / verification)
#
# Addresses are taken from the official building pages https://tulsu.ru/facilities/academic-building/<id>.

# {query} is replaced with the URL-encoded address.
map_url = "https://yandex.ru/maps/?text={query}"

[[building]]
prefixes = ["Гл."]
name = "Главный корпус"
address = "Тула, проспект Ленина, 92"
page = "https://tulsu.ru/facilities/academic-building/4"

